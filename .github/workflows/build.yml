name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build APK
        run: |
          docker run --rm -v "$(pwd)":/root/src -w /root/src \
            notfl3/cargo-apk sh -c '
              rustup update stable
              rustup default stable
              rustup target add aarch64-linux-android
              V=$(ls /opt/android-sdk-linux/platforms | sed "s/android-//" | sort -n | tail -1)
              sed -i "s/^android_version = .*/android_version = $V/; s/^target_sdk_version = .*/target_sdk_version = $V/" Cargo.toml
              cargo quad-apk build
              mkdir -p /root/src/out
              find /root/src/target -name "*.apk" -exec cp {} /root/src/out/blockcraft.apk \;
              chmod -R a+rwX /root/src/out
            '
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/blockcraft.apk
