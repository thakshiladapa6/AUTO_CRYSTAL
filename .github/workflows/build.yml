name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build APK
        run: |
          docker run --rm -v "$(pwd)":/root/src -w /root/src \
            notfl3/cargo-apk cargo quad-apk build
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: target/android-artifacts/**/*.apk
